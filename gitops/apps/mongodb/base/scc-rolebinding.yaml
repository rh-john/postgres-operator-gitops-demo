---
# Allow Percona MongoDB operator service accounts to use the anyuid SCC
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: percona-mongo-scc
  labels:
    app: percona-mongodb-operator
    managed-by: gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  # Operator runs in mongodb-operator namespace; this binding grants anyuid SCC
  # in the target namespace so MongoDB pods can run correctly on OpenShift.
  - kind: ServiceAccount
    name: percona-server-mongodb-operator
    namespace: mongodb-operator
