---
# Allow Percona MongoDB operator service accounts to use the anyuid SCC
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: percona-mongo-scc
  labels:
    app: percona-mongodb-operator
    managed-by: gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  # namespace is set by kustomize to the overlay namespace (mongo-dev / mongo-test / mongo-prod)
  - kind: ServiceAccount
    name: percona-server-mongodb-operator
