---
# OperatorGroup – OwnNamespace mode.
# The Percona certified operator does not support AllNamespaces.
# By deploying one operator per namespace, each team (mongo-dev / mongo-test / mongo-prod)
# gets a fully isolated operator instance — a core strength of the multitenancy story.
# spec.targetNamespaces is patched per overlay to match the deployment namespace.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: percona-mongodb-og
  labels:
    demo: dbaas
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  targetNamespaces: []   # patched per overlay
---
# OLM Subscription – installs Percona MongoDB Operator in this namespace.
# Wave -1 ensures OLM installs the operator BEFORE the PerconaServerMongoDB CR (wave 0).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: percona-server-mongodb-operator
  labels:
    demo: dbaas
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  channel: stable
  name: percona-server-mongodb-operator-certified
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
