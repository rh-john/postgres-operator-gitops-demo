---
# Percona Server MongoDB – dev (single-node replica set, minimal resources)
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: mongo-dev
  labels:
    environment: dev
    managed-by: gitops
spec:
  crVersion: "1.22.0"
  image: percona/percona-server-mongodb:7.0.30-16

  # Allow single-node replica set for dev (operator default minimum is 3)
  unsafeFlags:
    replsetSize: true

  replsets:
    - name: rs0
      size: 1   # Single node for dev – no HA overhead

      volumeSpec:
        persistentVolumeClaim:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

  backup:
    enabled: false
    image: percona/percona-backup-mongodb:2.12.0
