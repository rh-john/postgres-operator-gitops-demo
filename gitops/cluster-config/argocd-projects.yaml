---
# Project for cluster infrastructure (operators, RBAC)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-infrastructure
  namespace: openshift-gitops
spec:
  description: Cluster-wide infrastructure (operators, RBAC, monitoring)

  sourceRepos:
    - https://github.com/john-johansson/postgres-operator-gitops-demo
    # If using Forgejo, add your Forgejo repo URL here instead / in addition

  destinations:
    - namespace: postgres-operator
      server: https://kubernetes.default.svc
    - namespace: mongodb-operator
      server: https://kubernetes.default.svc
    - namespace: openshift-gitops
      server: https://kubernetes.default.svc
    - namespace: forgejo
      server: https://kubernetes.default.svc
    - namespace: '*'
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: 'operators.coreos.com'
      kind: OperatorGroup
    - group: 'operators.coreos.com'
      kind: Subscription
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition
    - group: 'admissionregistration.k8s.io'
      kind: ValidatingWebhookConfiguration
    - group: 'admissionregistration.k8s.io'
      kind: MutatingWebhookConfiguration
    - group: 'scheduling.k8s.io'
      kind: PriorityClass
    - group: 'user.openshift.io'
      kind: Group

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  orphanedResources:
    warn: false

---
# Project for PostgreSQL DBA teams (Crunchy PGO)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: team-postgres
  namespace: openshift-gitops
spec:
  description: PostgreSQL clusters (Crunchy PGO) for dev/test/prod

  sourceRepos:
    - https://github.com/john-johansson/postgres-operator-gitops-demo

  destinations:
    - namespace: 'pg-*'
      server: https://kubernetes.default.svc

  clusterResourceBlacklist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: PersistentVolumeClaim
    - group: 'apps'
      kind: StatefulSet
    - group: 'apps'
      kind: Deployment
    - group: 'rbac.authorization.k8s.io'
      kind: Role
    - group: 'rbac.authorization.k8s.io'
      kind: RoleBinding
    - group: 'postgres-operator.crunchydata.com'
      kind: PostgresCluster
    - group: 'policy'
      kind: PodDisruptionBudget
    - group: 'networking.k8s.io'
      kind: NetworkPolicy

  orphanedResources:
    warn: true

---
# Project for MongoDB DBA teams (Percona Operator)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: team-mongodb
  namespace: openshift-gitops
spec:
  description: MongoDB clusters (Percona Operator) for dev/test/prod

  sourceRepos:
    - https://github.com/john-johansson/postgres-operator-gitops-demo

  destinations:
    - namespace: 'mongo-*'
      server: https://kubernetes.default.svc

  clusterResourceBlacklist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: PersistentVolumeClaim
    - group: 'apps'
      kind: StatefulSet
    - group: 'rbac.authorization.k8s.io'
      kind: Role
    - group: 'rbac.authorization.k8s.io'
      kind: RoleBinding
    - group: 'psmdb.percona.com'
      kind: PerconaServerMongoDB
    - group: 'psmdb.percona.com'
      kind: PerconaServerMongoDBBackup
    - group: 'psmdb.percona.com'
      kind: PerconaServerMongoDBRestore
    - group: 'policy'
      kind: PodDisruptionBudget
    - group: 'networking.k8s.io'
      kind: NetworkPolicy

  orphanedResources:
    warn: true
