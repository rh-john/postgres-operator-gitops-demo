apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dbaas-rbac
  namespace: openshift-gitops
  labels:
    app: dbaas-rbac
    demo: dbaas
    managed-by: cluster-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-infrastructure

  source:
    repoURL: https://github.com/john-johansson/postgres-operator-gitops-demo
    targetRevision: feature/dbaas-operators
    path: gitops/cluster-config/dbaas-rbac

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
