apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DBaaS demo ArgoCD applications.
# This is the source for cluster-config-dbaas (app-of-apps-dbaas.yaml).
# The original gitops/cluster-config/kustomization.yaml (Zalando demo) is untouched.

resources:
  # Cluster infrastructure operators (sync wave 0)
  # Crunchy PGO: AllNamespaces OLM mode — one operator watches all pg-* namespaces.
  # Percona MongoDB: OwnNamespace OLM mode in mongodb-operator + WATCH_NAMESPACE env var
  #   pointing at mongo-dev/test/prod — true cluster-wide mode without AllNamespaces OLM.
  - crunchy-operator-app.yaml
  - percona-mongo-operator-app.yaml

  # Namespace management – pg-*/mongo-* (separate from old dba-*)
  - dbaas-namespaces-app.yaml

  # RBAC – Crunchy + Percona roles (separate from old rbac-cluster)
  - dbaas-rbac-app.yaml

  # Database instance applications (deployed by DBA users or uncomment to auto-deploy)
  # - team-pg-dev-app.yaml
  # - team-pg-test-app.yaml
  # - team-pg-prod-app.yaml
  # - team-mongo-dev-app.yaml
  # - team-mongo-test-app.yaml
  # - team-mongo-prod-app.yaml

  # Optional: self-hosted Forgejo Git server
  # - forgejo-app.yaml

commonLabels:
  demo: dbaas
