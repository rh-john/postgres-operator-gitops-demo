---
# Namespace for the Crunchy PGO operator
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-operator
  labels:
    managed-by: gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# OperatorGroup scoped to the postgres-operator namespace
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: crunchy-postgres-operator
  namespace: postgres-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  targetNamespaces:
    - postgres-operator
---
# OLM Subscription – installs Crunchy PGO from the certified-operators catalog
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: crunchy-postgres-operator
  namespace: postgres-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: v5
  name: crunchy-postgres-operator
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
