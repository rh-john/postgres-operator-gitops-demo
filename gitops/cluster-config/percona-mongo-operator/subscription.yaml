---
# Namespace for the Percona MongoDB operator
apiVersion: v1
kind: Namespace
metadata:
  name: mongodb-operator
  labels:
    managed-by: gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# OperatorGroup – OwnNamespace mode (certified operator does not support AllNamespaces)
# All MongoDB clusters are deployed into this same namespace.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: percona-server-mongodb-operator
  namespace: mongodb-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  targetNamespaces:
    - mongodb-operator
---
# OLM Subscription – installs Percona MongoDB Operator from certified-operators catalog
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: percona-server-mongodb-operator
  namespace: mongodb-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: stable
  name: percona-server-mongodb-operator-certified
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
