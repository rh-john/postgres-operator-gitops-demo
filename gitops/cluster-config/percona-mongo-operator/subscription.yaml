---
# Namespace for the Percona MongoDB operator
apiVersion: v1
kind: Namespace
metadata:
  name: mongodb-operator
  labels:
    managed-by: gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# OperatorGroup – watch all namespaces so one operator serves mongo-dev/test/prod
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: percona-server-mongodb-operator
  namespace: mongodb-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec: {}  # Empty spec = AllNamespaces install mode
---
# OLM Subscription – installs Percona MongoDB Operator from certified-operators catalog
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: percona-server-mongodb-operator
  namespace: mongodb-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: stable-v1
  name: percona-server-mongodb-operator
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
