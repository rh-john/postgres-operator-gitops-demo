---
# Namespace that hosts the operator process (OwnNamespace OLM install mode)
apiVersion: v1
kind: Namespace
metadata:
  name: mongodb-operator
  labels:
    managed-by: gitops
    demo: dbaas
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
# OperatorGroup in OwnNamespace mode — the only mode the certified catalog supports.
# The operator binary is then configured via WATCH_NAMESPACE to also watch
# mongo-dev / mongo-test / mongo-prod, giving us cluster-wide coverage without
# needing the AllNamespaces OLM install mode.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: percona-mongodb-og
  namespace: mongodb-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  targetNamespaces:
    - mongodb-operator
---
# OLM Subscription — installs Percona MongoDB Operator from the certified catalog
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: percona-server-mongodb-operator
  namespace: mongodb-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: stable
  name: percona-server-mongodb-operator-certified
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  config:
    env:
      # Cluster-wide mode: watch mongodb-operator plus all three team namespaces.
      # OLM passes this env var into the operator Deployment at install time,
      # so we never need to patch the Deployment manually after install.
      - name: WATCH_NAMESPACE
        value: "mongodb-operator,mongo-dev,mongo-test,mongo-prod"
