---
# ClusterRole for PostgreSQL cluster management (Crunchy PGO)
# Allows users to create, read, update, and delete PostgreSQL clusters
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-user-role
  labels:
    app: crunchy-postgres-operator
    managed-by: gitops
rules:
  # Manage Crunchy PGO PostgresCluster custom resources
  - apiGroups:
      - postgres-operator.crunchydata.com
    resources:
      - postgresclusters
      - postgresclusters/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Read PGO OperatorConfiguration
  - apiGroups:
      - postgres-operator.crunchydata.com
    resources:
      - pgupgrades
      - crunchybridgeclusters
    verbs:
      - get
      - list
      - watch
  
  # Manage secrets for database credentials
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  
  # View services and pods
  - apiGroups:
      - ""
    resources:
      - services
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch
  
  # View statefulsets
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
  
  # View persistent volume claims
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
