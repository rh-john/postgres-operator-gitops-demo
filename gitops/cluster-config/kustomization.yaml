apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ArgoCD Projects (RBAC isolation)
  - argocd-projects.yaml

  # Team namespaces (sync wave -1, created before operators)
  - team-namespaces-app.yaml

  # RBAC (sync wave -1)
  - rbac-cluster-app.yaml

  # Database operators (sync wave 0)
  - crunchy-operator-app.yaml
  - percona-mongo-operator-app.yaml

  # Optional: self-hosted Git server
  # - forgejo-app.yaml

  # Note: Team database instance apps below are deployed by DBA users,
  # not bootstrapped by cluster-admin here. They are included for reference
  # and can be uncommented to have the cluster-config App-of-Apps manage them.
  # - team-pg-dev-app.yaml
  # - team-pg-test-app.yaml
  # - team-pg-prod-app.yaml
  # - team-mongo-dev-app.yaml
  # - team-mongo-test-app.yaml
  # - team-mongo-prod-app.yaml
